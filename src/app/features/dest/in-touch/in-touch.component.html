<section class="relative py-20 lg:py-28 overflow-hidden bg-[#0B1F3B]">
  <!-- Decorative Elements -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-[#d89d2e]/20 rounded-full blur-3xl"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div
      class="grid lg:grid-cols-2 gap-12 items-center bg-white/5 backdrop-blur-md border border-white/10 rounded-[40px] p-8 md:p-12 lg:p-16"
    >
      <!-- Left Side -->
      <div>
        <span class="uppercase tracking-[4px] text-[#d89d2e] text-sm font-medium">
          Newsletter
        </span>

        <h2 class="mt-5 text-4xl md:text-5xl font-bold text-white leading-tight">
          Stay Connected to
          <span class="text-[#d89d2e] italic"> The Wonder </span>
        </h2>

        <div class="w-24 h-1 bg-[#d89d2e] rounded-full my-8"></div>

        <p class="text-white/75 text-lg leading-relaxed max-w-xl">
          Subscribe to receive seasonal itineraries, accessibility updates, travel inspiration, and
          exclusive destination guides curated for travellers of all abilities.
        </p>
      </div>

      <!-- Right Side -->
      <div>
        <form class="space-y-6">
          <!-- Email -->
          <div>
            <input
              type="email"
              placeholder="Enter your email address"
              class="w-full h-16 px-6 rounded-2xl bg-white text-gray-900 outline-none border-2 border-transparent focus:border-[#d89d2e] transition"
            />
          </div>

          <!-- Checkbox -->
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" class="mt-1 w-5 h-5 accent-[#d89d2e]" />

            <span class="text-white/70 text-sm leading-relaxed">
              I consent to receiving newsletters, travel updates, accessibility resources, and
              promotional communications.
            </span>
          </label>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full md:w-auto px-10 py-4 bg-[#d89d2e] text-white font-semibold rounded-full hover:scale-105 transition duration-300 shadow-xl"
          >
            Subscribe Now
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
