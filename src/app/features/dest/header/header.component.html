<section class="relative w-full h-[450px] md:h-screen overflow-hidden">
  <!-- VIDEO BACKGROUND -->
  <div class="inset-0 fixed -z-10 md:pb-6 md:py-5">
    <video
      class="absolute inset-0 top-0 pt-20 w-full h-[550px] md:h-full object-cover object-top"
      #heroVideo
      autoplay="true"
      loop
      muted="muted"
      playsinline
      preload="auto"
    >
      <source src="/assets/images/videoHeader1.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- DARK OVERLAY -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/50 to-black/70"></div>

  <!-- CONTENT -->
  <div class="relative z-10 h-full flex items-center">
    <div class="container mx-auto px-6">
      <div class="max-w-2xl text-white">
        <p class="text-sm md:text-base text-white/80 tracking-wide mb-4">
          {{ 'destenationPage.destinationsHero.subtitle' | translate }}
        </p>

        <h1 class="text-4xl md:text-6xl font-semibold leading-tight mb-6">
          {{ 'destenationPage.destinationsHero.title' | translate }}
        </h1>

        <a
          routerLink="/women-stories"
          class="inline-block px-6 py-3 bg-[#d89d2e] hover:bg-[#c48d1f] text-[#0B1F3B] font-medium rounded-md transition shadow-[0_0_25px_rgba(216,157,46,0.25)]"
        >
          {{ 'destenationPage.destinationsHero.button' | translate }}
        </a>
      </div>
    </div>
  </div>
</section>
