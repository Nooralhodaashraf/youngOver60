<section class="relative bg-white py-20 overflow-hidden">
  <!-- decorative background -->
  <div
    class="absolute -top-20 -right-20 w-[300px] h-[300px] rounded-full bg-[#d89d2e]/10 blur-3xl"
  ></div>
  <div
    class="absolute -bottom-24 -left-24 w-[350px] h-[350px] rounded-full bg-[#0B1F3B]/5 blur-3xl"
  ></div>

  <div class="max-w-[1200px] mx-auto px-6 relative z-10 text-center">
    <!-- label -->
    <span class="text-[#d89d2e] tracking-[0.3em] text-sm uppercase">
      {{ 'women.womenHeader.badge' | translate }}
    </span>

    <!-- title -->
    <h1 class="text-3xl md:text-5xl font-semibold text-[#0B1F3B] mt-4">
      {{ 'women.womenHeader.title' | translate }}
    </h1>

    <!-- subtitle -->
    <p class="text-gray-600 mt-5 max-w-2xl mx-auto leading-relaxed text-sm md:text-base">
      {{ 'women.womenHeader.subtitle' | translate }}
    </p>

    <!-- divider -->
    <div class="flex justify-center mt-8">
      <div class="w-24 h-[2px] bg-[#d89d2e]/60 rounded-full"></div>
    </div>
  </div>
</section>
