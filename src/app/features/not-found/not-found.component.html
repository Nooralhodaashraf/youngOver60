<section
  class="min-h-screen flex items-center justify-center bg-[#0B1F3B] text-white relative overflow-hidden"
>
  <!-- decorative glow -->
  <div
    class="absolute w-[400px] h-[400px] bg-[#d89d2e]/10 blur-3xl rounded-full -top-40 -left-40"
  ></div>
  <div
    class="absolute w-[400px] h-[400px] bg-[#d89d2e]/10 blur-3xl rounded-full -bottom-40 -right-40"
  ></div>

  <div class="text-center px-6 z-10">
    <!-- number -->
    <h1 class="text-[120px] md:text-[180px] font-bold text-[#d89d2e] leading-none">
      {{ 'notFoundPage.errorCode' | translate }}
    </h1>

    <!-- title -->
    <h2 class="text-2xl md:text-3xl font-semibold mt-4">
      {{ 'notFoundPage.title' | translate }}
    </h2>

    <!-- description -->
    <p class="text-white/60 mt-4 max-w-md mx-auto text-sm md:text-base leading-relaxed">
      {{ 'notFoundPage.description' | translate }}
    </p>

    <!-- buttons -->
    <div class="flex flex-col md:flex-row gap-4 justify-center mt-8">
      <a
        routerLink="/"
        class="px-6 py-3 rounded-full bg-[#d89d2e] text-[#0B1F3B] font-medium hover:scale-105 transition"
      >
        {{ 'notFoundPage.buttons.home' | translate }}
      </a>

      <a
        routerLink="/news"
        class="px-6 py-3 rounded-full border border-[#d89d2e]/40 text-white hover:bg-white/10 transition"
      >
        {{ 'notFoundPage.buttons.news' | translate }}
      </a>
    </div>
  </div>
</section>
